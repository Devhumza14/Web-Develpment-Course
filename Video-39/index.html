<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID</title>
    <style>
        .containor{
            display: grid;
            width: 80vw;
            /* grid-template-columns: [pahla]120px [dosra]100px [teesra]; */
            grid-template-rows: 1fr 2fr 1fr;
            border: 2px solid black;
        }
        .item{
            border: 2px solid red;
            height: 20px;
            /* width: 20px; */
        }

        .item-4{
            grid-column: pahla/teesra;
            grid-row: 1/2;
            /* grid-row-start: 1;
            grid-row-end: 2; */
        }
        
        .item-1{
            grid-column: 1/3;
            grid-row: 1/2;

        }

    </style>
</head>
<body>
    <div class="containor">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
        <!-- <div class="item">6</div> -->
    </div>
    
</body>
</html>
