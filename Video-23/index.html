<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            /* box-sizing: border-box; */
            border: 2px solid black;
            display: inline-block;
            margin: 44px;
            padding: 34px;
            display: flex;
            justify-content: center;

        }
        .box1{
            /* display: none; */
            /* visibility: hidden; */
        }
        
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>
    <div class="box box1">
        i am also a box
    </div>
    <span class="box">
        i am a span
    </span>

</body>
</html>
