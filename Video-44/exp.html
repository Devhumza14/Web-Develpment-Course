<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }

    body {
        display: grid;
        place-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .containor {
        display: grid;
        grid-template-areas: "card1 card2 card3"
            "card4 card5 card6"
            "card7 card8 card9";
        ;

        border: 2px solid black;
        /* height: 100vh; */
        width: 80vw;
        row-gap: 20px;
        column-gap: 20px;
        justify-content: center;
        align-content: center;



    }

    .btn {
        padding: 10px 0;
        cursor: pointer;
        font-size: 12px;
        border-radius: 12px;
        font-weight: bold;
        
    }

    .btn-green {
        background-color: rgb(167, 232, 167);
        color: aliceblue;
    }

    .btn-blue {
        background-color: rgb(196, 196, 239);
        color: aliceblue;
    }


    .item {
        height: 140px;
        width: 324px;
        border: 2px solid black;
        justify-content: center;
        align-items: center;
        /* gap: 340px; */
        background-color: aliceblue;
        display: grid;


    }

    .item-1 {

        grid-area: card1;

    }

    .item-2 {
        grid-area: card2;

    }
</style>
