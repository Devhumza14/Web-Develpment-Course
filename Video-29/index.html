<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise no 3 Card Making</title>
    <style>
        .card {
            border: 2px solid black;
            height: 450px;
            width: 300px;
            border-radius: 15px;
            background-color: white;
        }

        .image img {
            box-sizing: border-box;
            border: 2px solid white;
            height: 250px;
            width: 300px;
            padding: 2px;
            border-radius: 15px;

        }

        .capsule {
            font-weight: bold;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            /* border: 2px solid black; */

        }

        .cap1 {
            border: 2px solid black;
            border-radius: 15px;
            padding: 2px;
            text-align: center;
            margin: 4px;

        }

        .cap2 {

            border: 2px solid black;
            border-radius: 15px;
            padding: 4px;
            margin: 5px;
            text-align: center;
        }

        .content {
            padding: 4px;

        }

        .readcap {
            border: 2px solid black;
            text-align: center;
            border-radius: 15px;
            display: inline-block;
            font-weight: bold;
            position: relative;
            left: 100px;
            color: azure;
            background-color: skyblue;
            




        }
    </style>
</head>

<body>
    <div class="card">
        <div>
            <div class="image">
                <img src="https://cdn.pixabay.com/photo/2017/07/24/19/57/tiger-2535888_640.jpg" alt="failed to load">
            </div>
            <div class="capsule">
                <span class="cap1">Tiger</span>
                <span class="cap2">Nature</span>
            </div>
            <div class="content">
                <h2>Bengal Tiger</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique atque officia deserunt a rerum
                    ipsa. Quis!</p>
            </div>
            <div class="readcap">
                Read More
            </div>
        </div>

    </div>
</body>

</html>
