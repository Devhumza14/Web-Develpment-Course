<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Form</h1>
    <div>
        <label for="username">Enter you Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
    </div>

    <div>

        <label for="password">Enter you password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autofocus>

    </div>
    <div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe to newsletter</label>
    </div>

    <div>
        <label for="comment">Enter your comment</label>
        <textarea name="comment" id="comment" rows="4" cols="50">
    </textarea>
    </div>
    <div>
        <label for="fruits">Select your favourite fruit</label>
        <select name="fruits" id="fruit">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
        </select>
    </div>
</body>


</html>
