<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image, List and Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img height="300" src="igor-omilaev-eGGFZ5X2LnA-unsplash.jpg" alt="Train Image">

    <table>
        <caption>Student Details</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>caste</th>
        </tr>
        
        <tr>
            <td rowspan="2">Humza</td>
            <td colspan="5">25</td>
            <td>Shia</td>
        </tr>
        <tr>
            <td>Shia</td>
        </tr>
    </table>

    <ul type="square">
        <h1>This is a Unordered List</h1>
        <li>Humza</li>
        <li>Sheri</li>
        <li>Hasaeeb</li>
    </ul>
    <ol type="i">
        <h1>This is a Ordered List</h1>
        <li>Humza</li>
        <li>Sheri</li>
        <li>Haseeb</li>
        <li>Adnan</li>
    </ol>
    <dl>
        <h1>This is a Defination list</h1>
        <dt>HTML</dt>
        <dd>hello this is HTML</dd>
    </dl>

</body>
</html>
