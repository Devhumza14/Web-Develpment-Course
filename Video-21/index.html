<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity and Cascade</title>
    <style>
        h1{
            color: red;
        }
        .yellow{
            color: aqua;
        }
        .cred{
            color: darkgoldenrod;
        }
        .cpurple{
            color: purple;
        }
        [data-x=a]{
            background-color: black;
        }
    </style>
</head>
<body>
    <div>
        <h1  class="yellow cred cpurple" data-x="a">Humza Naqvi</h1>
        

    </div>
</body>
</html>
