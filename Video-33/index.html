<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicolor Navbar</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        :root{
            --color:rgba(0, 0, 0, 0.201);
            --seccolor:rgb(180, 58, 58);
            --defpad:5px;
            
        }
        
        header{
            
            

        }
        
        ul{
            /* display: inline; */
            list-style: none;
            color: var(--color);
            background-color: var(--seccolor);
        }
        ul li{
            padding: var(--defpad);
            display: inline;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
