<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicolor Navbar</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        :root{
            --color:rgba(162, 35, 35, 0.201);
            --seccolor:rgb(184, 255, 184);
            --defpad:5px;
            
        }
        
        div{
            
            

        }
        
        ul{
            display: flex;
            list-style: none;
            color: var(--color);
            background-color: var(--seccolor);
        }
        ul li{
            padding: var(--defpad);
        }
    </style>
</head>
<body>
    <div>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </div>
    
</body>
</html>
