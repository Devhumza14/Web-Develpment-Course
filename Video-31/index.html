<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Query</title>
    <style>
        body {
            background-color: gainsboro;
        }

        @media screen and (orientation: landscape) {
            body{
                border: 2px solid red;
            }
            
        }

        @media only screen and (max-width: 455px) {
            body {
                background-color: aqua;
            }

            .boxes{
                flex-direction: column;
            }

        }








        .box {
            background-color: rgb(96, 30, 237);
            height: 344px;
            width: 344px;
            padding: 3px;
            margin: 3px;
        }

        .boxes {
            display: flex;
        }
    </style>

</head>

<body>

    <div>
        Hello is am body
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>

</html>
