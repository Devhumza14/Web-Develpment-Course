<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Styling Lists using CSS</title>
    <style>
        nav ul li{
            /* list-style: decimal; */
            background-color: rgb(211, 196, 196);
            color: rgb(0, 0, 0);
            list-style-position: inside;
            border: 2px solid salmon;
            list-style-type: "🐐";
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact us</li>
        </ul>
    </nav>

</body>

</html>
