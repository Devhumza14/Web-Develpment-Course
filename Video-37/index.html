<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Exercise 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: bisque;
        }

        nav {
            background-color: black;
            height: 100px;
            /* position: sticky; */
            width: 100vw;
            /* top: 0px; */
            /* margin: 0; */
            /* padding: 0; */
        }
        header{
            position: sticky;
            top: 0px;
            z-index: 100;
        }

        li {
            list-style: none;
            display: inline;
            padding: 13px;
            color: pink;
        }

        .containor {
            border: 2px solid black;
            width: 50vw;
            height: 450px;
            /* display: flex; */
            padding: 13px;
            margin: 13px;
            /* flex-direction: row; */
        }

        main {
            display: flex;
            flex-direction: row;
        }

        .sec1{
            background-color: blueviolet;

        }

        .sec2{
            background-color: chocolate;
        }

        .capsule{
            width: auto;
            height: 600px;
            border: 2px solid black;
            border-radius: 20px;
            justify-content: center;
            align-items: center;
            display: flex;
            margin: 14px;
            padding: 4px ;
        }
        
        footer{
            background-color: black;
            height: 100px;
            position: sticky;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        footer div{
            border: 2px solid white;
            background-color: white;
            height: 70px;
            width: 70px;
            border-radius: 50%;
            position: sticky;
            z-index: 200;
            bottom: 20px;
            right: 15px; 
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact Us</li>
            </ul>
        </nav>


    </header>
    <main>



        <div class="containor sec1">
            <div>
                i am section 1
            </div>

        </div>
        <div class="containor sec2">
            i am section 2
        </div>
        

    </main>

    <div class="capsule">
        
        Hello and welcome
    </div>

    <footer>
        <div>

        </div>

    </footer>

</body>

</html>
