<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child {
            padding: 12px;
            margin: 12px;
            border: 2px solid black;
            background-color: aliceblue;

        }

        .childcontainer {
            padding: 12px;
            margin: 12px;
            border: 2px solid black;
            background-color: rgb(132, 188, 236);

        }

        .container {
            padding: 12px;
            margin: 12px;
            border: 2px solid black;
            background-color: rgb(36, 148, 245);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="childcontainer">
            <div class="child">
                I am a child
                </section>
            </div>
        </div>
        <script>
            document.querySelector(".child").addEventListener("click", (e) => {
                e.stopPropagation()
                alert("child is clicked")
            })

            document.querySelector(".childcontainer").addEventListener("click", (e) => {
                e.stopPropagation()
                alert("child container is clicked")
            })
            document.querySelector(".container").addEventListener("click", (e) => {
                e.stopPropagation()
                alert("container is clicked")
            })


            const getrandomcolor = () => {
                val1 = Math.floor(0 + Math.random() * 255)
                val2 = Math.floor(0 + Math.random() * 255)
                val3 = Math.floor(0 + Math.random() * 255)
                return `rgb(${val1},${val2}, ${val3})`
            }

            let a = setInterval(() => {
                document.querySelector(".child").style.backgroundColor = getrandomcolor()

            }, 3000);

            console.log(a) 

            // like this setinterb=val in which the work happen and continue manner there is same syntax with settimeout it does the work done after that interbval only one time to clear it we use cleartimeout


        </script>
</body>

</html>
