<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>

    <style>
        .container{
            height: 80vh;
            width: 40vw;
            background-color: wheat;

        }

        .box{
            height: 40px;
            width: 20px;
            background-color: firebrick;
            animation: humzakaanimation;
            animation-duration: 3s;
            animation-iteration-count: 2;
        }

        @keyframes humzakaanimation{
            from{

            }
            to{
                transform: translateX(1000px);
            }

        }

    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            

        </div>
    </div>
    
</body>
</html>
