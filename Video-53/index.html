<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Pakistan - Watch TV Shows Online, Watch Movies Online</title>
    <meta name="description" content="My First clone for the site and its Netflix">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">
        <nav>
            <span><img width="90px" src="/assets/images/logo.svg" alt="Netflix logo"></span>
            <div>
                <button class="btn">Sign in</button>
            </div>
        </nav>

        <div class="box"></div>
        <div class="hero">
            <span>Unlimited movies, TV shows, and more
            </span>
            <span>Starts at Rs 250. Cancel anytime.

            </span>
            <span>Ready to watch? Enter your email to create or restart your membership.
            </span>
            <div class="email">
                <input type="text" placeholder="Email address">
                <button class="btn-red">Get Started &nbsp; &gt;</button>

            </div>

        </div>

        <div class="seperation">

        </div>

        <div class="text">
            Trending now
        </div>
        <section class="first">

            <div class="images">
                <div class="card">
                    <span class="rankno">1</span>
                    <img src="/assets/images/1.webp" alt="Dhammal 4">

                </div>
                <div class="card">
                    <span class="rankno">2</span>
                    <img src="/assets/images/2.webp" alt="Cocktail two">
                </div>
                <div class="card">
                    <span class="rankno">3</span>
                    <img src="/assets/images/3.webp" alt="Cocktail two">
                </div>
                <div class="card">
                    <span class="rankno">4</span>
                    <img src="/assets/images/4.webp" alt="Cocktail two">
                </div>
                <div class="card">
                    <span class="rankno">5</span>
                    <img src="/assets/images/5.webp" alt="Cocktail two">
                </div>
                <div class="card">
                    <span class="rankno">6</span>
                    <img src="/assets/images/6.webp" alt="Cocktail two">
                </div>
                <div class="card">
                    <span class="rankno">7</span>
                    <img src="/assets/images/7.webp" alt="Cocktail two">
                </div>
            </div>

        </section>

        <section class="more-reason">
            <div class="more-text">
                More Reasons to Join

            </div>

            <div class="cards-more">
                <span class="bold">Enjoy on your TV</span>
            </div>
            <span class="light">Watch on Smart TVs, Playstation, Xbox, Chromecast, Apple TV, Blu-ray players, and more.

            </span>
        </section>

    </div>

</body>

</html>
